<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katsuri</title>
    <!-- Conexiones -->
     <link rel="stylesheet" href="css/style.css">
     <script src="js/main.js" defer></script>
</head>

<body>
    <!-- Hero de la página -->
     <header id="inicio"> 
        <nav>
            <ul>
                <li><a href="#inicio"> Inicio </a></li>
                <li><a href="#menu"> Menú </a></li>
                <li><a href="#contacto"> Contacto </a></li>
            </ul>
        </nav>
    <!--Galería de fotos-->
    <div class="galeria-slider">
        <!--Aqui van las fotos-->
        <img src="assets/img/ " alt="nombre de la imagen">
    </div>
    <!--Título de la marca-->
    <div class="hero-titulo">
        <h1>KATSURI</h1>
        <p>Postres hechos con el corazón</p>
    </div>
     </header>    

     <!--Sección Menu-->
     <section id="menu">
        <h2>Nuestro Menú</h2>
        <!--Menú para galletas-->
        <div class="galletas">
            <h3> Galletas tipo New York</h3>
            <article class="card-producto">
                <img src="assets/img/ " alt="nombre de la imagen">
                <h4> NOMBRE DE LA GALLETA </h4>
                <p> DESCRIPCION DE LA GALLETA </p>
                <p class="precio"> $0.00 </p>
                <button class="btn-pedir"> PEDIR </button>
            </article>
        </div>
        <!--Menú para donas-->
        <div class="donas">
            <h3> Mini Donitas</h3>
            <article class="card-producto">
                <img src="assets/img/ " alt="nombre de la imagen">
                <h4> NOMBRE DE LA DONA</h4>
                <p> DESCRIPCION DE LA DONA </p>
                <p class="precio"> $0.00 </p>
                <button class="btn-pedir"> PEDIR </button>
            </article>
        </div>
     </section>
</body>

</html>
